projects:
  - name: "Agent Bridge"
    tech: "TypeScript, OpenWA, WhatsApp, Coding Agents, k3s"
    description: |
      Drive Command Code, Codex and Claude Code from WhatsApp through an
      existing OpenWA gateway. A shared event contract carries progress,
      responses and supported approval requests. Harnesses keep separate
      histories; one active webhook receives new turns.
      https://mayurathavale.com/projects/agent-bridge/

  - name: "Jobwatch"
    tech: "Go, Python, React, SQLite, Telegram, Gmail, k3s"
    description: |
      My self-hosted job-search tool collects postings, prepares tailored
      resumes and helps me review roles and outreach. I manage applications
      through a React dashboard or Telegram.

      Collection: a 15-minute Go poller reads Greenhouse, Lever, Ashby,
      Workday, RemoteOK, We Work Remotely, Remotive and web3.career.
      Five sources run concurrently with 60-second timeouts. Word-boundary
      title filters and country exclusions screen roles. Exact IDs plus
      normalized company/title/location deduplicate postings across sources
      within 30 days. Unsupported boards use manual URL or pasted-JD input.

      Tailoring: a 30-minute Python job fetches the JD, selects recorded
      experience and approved skills, compiles LaTeX with Tectonic and checks
      for one page, with one tighter retry. LLM judging returns a verdict,
      fit score, work mode and reason against a preference profile.
      kimi-k3 falls back to glm-5.3, then labelled rule-based scoring.
      Batch tailored alerts below fit 45 are suppressed; manual submissions
      and missing scores bypass that threshold. Raw poll alerts are separate.
      Automated claim checks do not cover every explicit manual rewrite.

      Actions: Telegram long polling and dashboard requests feed a SQLite
      events queue. Updates and the Telegram offset commit together.
      Four handlers atomically claim status, note, resume, outreach and
      run-now actions. The dashboard shows pending/running/done/failed state.
      Interrupted events recover on restart, capped at three attempts;
      ordinary handler failures do not automatically retry. External side
      effects are not exactly-once. One Recreate worker prevents competing
      Telegram consumers; shutdown allows 120 seconds for active work.

      Outreach: import LinkedIn connections, generate or revise email,
      save/update Gmail drafts and send after confirmation. Founder outreach
      combines sector and company-size checks with a supplied recipient;
      Apollo's free tier cannot provide founder emails in this setup.
      Applications are submitted by me, not automatically.

      Deployment: dashboard, worker and CronJobs share one persistent volume
      on Contabo k3s. React assets are embedded in the Go binary; SQLite WAL
      stores jobs and queued actions without a separate database or broker.
      GitHub Actions copies source into the volume, builds the binary and
      restarts workloads. Traefik provides HTTPS and dashboard Basic Auth.
      This is a single-server system. Failed tailoring entries need an
      explicit retry; pod-home PDFs are not persistent storage.

      Architecture: https://mayurathavale.com/projects/jobwatch/
      Source: https://github.com/mayurathavale18/jobwatch

